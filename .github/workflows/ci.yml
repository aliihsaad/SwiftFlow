name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_RELEASE_CHANNEL: production_full
      NEXT_PUBLIC_SUPABASE_URL: https://swiftflow-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_APP_URL: https://swiftflow-ci.invalid
      APP_SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DEVELOPER_API_KEY_PEPPER: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      INSTAGRAM_APP_ID: ci-instagram-app-id
      INSTAGRAM_APP_SECRET: ci-instagram-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-meta-webhook-verify-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
